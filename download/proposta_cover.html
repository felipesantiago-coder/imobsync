<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    @page { size: 794px 1123px; margin: 0; }
    :root {
      --c-bg: #f5f5f4;
      --c-accent: #92761f;
      --c-text: #151513;
      --c-muted: #7e7c74;
      --c-mid: #4e4732;
    }
    html, body { margin: 0; padding: 0; width: 794px; height: 1123px; background: var(--c-bg); color: var(--c-text); font-family: 'Inter', sans-serif; }
    @media screen {
      html { height: auto; display: flex; justify-content: center; min-height: 100vh; background: var(--c-bg); }
      body { transform-origin: top center; scale: min(1, calc(100vw / 794), calc(100vh / 1123)); margin: 0 auto; box-shadow: 0 0 60px rgba(0,0,0,0.15); }
    }
    .cover { width: 794px; height: 1123px; position: relative; box-sizing: border-box; }

    /* Layer 1 - Background */
    .bg-layer { position: absolute; inset: 0; overflow: hidden; z-index: 1; }
    .bg-circle { position: absolute; right: 50px; top: 220px; width: 180px; height: 180px; border: 1.5px solid var(--c-accent); opacity: 0.07; border-radius: 50%; }

    /* Layer 2 - Structure */
    .anchor-line { position: absolute; left: 95px; top: 180px; bottom: 180px; width: 5px; background: var(--c-mid); z-index: 2; }

    /* Layer 3 - Content (each element absolutely positioned, no nesting) */
    .kicker { position: absolute; top: 220px; left: 150px; font-size: 11pt; font-weight: 500; color: var(--c-muted); letter-spacing: 4pt; text-transform: uppercase; z-index: 3; }
    .hero-line1 { position: absolute; top: 300px; left: 150px; font-size: 52pt; font-weight: 900; line-height: 1.15; color: var(--c-text); font-family: 'Playfair Display', serif; z-index: 3; }
    .hero-line2 { position: absolute; top: 380px; left: 150px; font-size: 52pt; font-weight: 900; line-height: 1.15; color: var(--c-accent); font-family: 'Playfair Display', serif; z-index: 3; }
    .summary { position: absolute; top: 560px; left: 150px; font-size: 13pt; line-height: 1.6; color: var(--c-muted); max-width: 420px; font-weight: 300; z-index: 3; }
    .meta-label-1 { position: absolute; top: 750px; left: 150px; font-size: 9pt; font-weight: 600; color: var(--c-accent); letter-spacing: 2pt; text-transform: uppercase; z-index: 3; }
    .meta-value-1 { position: absolute; top: 770px; left: 150px; font-size: 13pt; font-weight: 700; color: var(--c-text); z-index: 3; }
    .meta-label-2 { position: absolute; top: 810px; left: 150px; font-size: 9pt; font-weight: 600; color: var(--c-accent); letter-spacing: 2pt; text-transform: uppercase; z-index: 3; }
    .meta-value-2 { position: absolute; top: 830px; left: 150px; font-size: 13pt; font-weight: 400; color: var(--c-text); z-index: 3; }
    .footer-left { position: absolute; bottom: 90px; left: 150px; font-size: 9pt; color: var(--c-muted); letter-spacing: 1.5pt; text-transform: uppercase; z-index: 3; }
    .footer-right { position: absolute; bottom: 90px; right: 100px; font-size: 8pt; color: var(--c-muted); opacity: 0.5; letter-spacing: 1pt; text-transform: uppercase; z-index: 3; }
  </style>
</head>
<body>
  <div class="cover">
    <div class="bg-layer">
      <div class="bg-circle"></div>
    </div>
    <div class="anchor-line"></div>
    <div class="kicker">Proposta Comercial</div>
    <div class="hero-line1">Quadra</div>
    <div class="hero-line2">Desk</div>
    <div class="summary">Sistema de gestao para imobiliarias: espelho de vendas digital, simulador de fluxo de pagamento e gestao centralizada de disponibilidade de unidades.</div>
    <div class="meta-label-1">Preparado para</div>
    <div class="meta-value-1">Quadraimob</div>
    <div class="meta-label-2">Data</div>
    <div class="meta-value-2">Agosto de 2025</div>
    <div class="footer-left">Quadra Desk</div>
    <div class="footer-right">Documento confidencial</div>
  </div>
</body>
</html>
